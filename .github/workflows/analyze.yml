name: analyze

on:
  push:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test core
        run: flutter test
      - name: Test dio adapter
        run: flutter test
        working-directory: packages/flutter_data_kit_dio
      - name: Test supabase adapter
        run: flutter test
        working-directory: packages/flutter_data_kit_supabase
      - name: Test firebase adapter
        run: flutter test
        working-directory: packages/flutter_data_kit_firebase
      - name: Test drift adapter
        run: flutter test
        working-directory: packages/flutter_data_kit_drift
