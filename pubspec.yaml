name: flutter_data_kit
description: >
  Backend contracts, PagedList, cacheFor, and repository patterns for Lemsa
  Flutter apps. Vendor SDKs live in adapter packages.
version: 1.0.0
homepage: https://github.com/fodilfliti/flutter_data_kit
repository: https://github.com/fodilfliti/flutter_data_kit
issue_tracker: https://github.com/fodilfliti/flutter_data_kit/issues
documentation: https://github.com/fodilfliti/flutter_data_kit#readme

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

workspace:
  - example
  - packages/flutter_data_kit_dio
  - packages/flutter_data_kit_supabase
  - packages/flutter_data_kit_firebase
  - packages/flutter_data_kit_drift

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  lemsa_core_kit: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - flutter
  - pagination
  - riverpod
  - repository

flutter:
