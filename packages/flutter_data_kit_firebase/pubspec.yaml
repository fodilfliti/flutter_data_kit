name: flutter_data_kit_firebase
description: >
  mapFirebase() failure mapper and typed Auth / Firestore / Storage / FCM
  helpers for flutter_data_kit.
version: 0.0.1
publish_to: none
homepage: https://github.com/fodilfliti/flutter_data_kit
repository: https://github.com/fodilfliti/flutter_data_kit
issue_tracker: https://github.com/fodilfliti/flutter_data_kit/issues

environment:
  sdk: ^3.7.2
  flutter: ">=3.29.0"

resolution: workspace

dependencies:
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  firebase_storage: ^13.5.0
  flutter:
    sdk: flutter
  flutter_data_kit: ^0.0.1
  lemsa_core_kit:
    path: ../../../lemsa_core_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0
